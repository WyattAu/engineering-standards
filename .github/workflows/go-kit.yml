# WyattAu shared Go CI — the Go gate matrix (proportionate to rust-kit.yml).
# Called from each Go repo:
#   jobs:
#     quality:
#       uses: WyattAu/engineering-standards/.github/workflows/go-kit.yml@main
#
# Gates: build → golangci-lint → test -race → govulncheck. Coverage and
# fuzz live in repo CI (repo-specific thresholds/timeout budgets).

name: quality

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version (stable | oldstable | 1.x)"
        required: false
        default: "stable"
        type: string
      lint:
        description: "Run golangci-lint"
        required: false
        default: true
        type: boolean
      race:
        description: "Run tests with -race"
        required: false
        default: true
        type: boolean
      vuln:
        description: "Run govulncheck ./..."
        required: false
        default: true
        type: boolean

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true

      - name: build
        run: go build ./...

      - name: lint
        if: ${{ inputs.lint }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: latest

      - name: test
        run: go test ${{ inputs.race && '-race' || '' }} ./...

      - name: govulncheck
        if: ${{ inputs.vuln }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
