# Release provenance — per-crate build attestation.
# Trigger manually per crate (workflow_dispatch): builds the crate's repo
# from its default branch with --locked, generates SHA256SUMS and a
# provenance note, and commits both to provenance/ in this repo.
#
# GitHub artifact attestations (actions/attest-build-provenance) are attempted
# opportunistically — they require id-token/attestations write, which some
# repos deny. The committed provenance/ note is the source of record either
# way. Reproducibility context: see REPRODUCIBILITY.md (hashes are
# same-machine deterministic; CI hashes are recorded per-build).
name: attest

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Kit repo under WyattAu/ (e.g. salting)"
        required: true
        type: string
      ref:
        description: "Git ref of the kit repo (default: main)"
        required: false
        default: main
        type: string

permissions:
  contents: write # commit provenance/ + SHA256SUMS to this repo
  id-token: write # opportunistic GitHub artifact attestation
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: checkout engineering-standards (provenance store)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: eng

      - name: checkout kit repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: WyattAu/$CRATE
          ref: $REF
          path: kit
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        id: toolchain

      - name: build (--release --locked)
        working-directory: kit
        run: cargo build --release --locked

      - name: collect artifact hashes
        id: hashes
        working-directory: kit
        # Inputs arrive as environment variables, never interpolated into the
        # script body (zizmor template-injection, error-class, fixed in loop 30).
        env:
          CRATE: $CRATE
          TOOLCHAIN: ${{ steps.toolchain.outputs.version }}
        run: |
          set -euo pipefail
          crate="$CRATE"
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          commit=$(git rev-parse HEAD)
          toolchain="$TOOLCHAIN"
          primary=$(find target/release -maxdepth 1 -type f ! -name '*.d' \
            ! -name 'CACHEDIR.TAG' ! -name '.cargo-lock' | sort)
          primary_hash=$(sha256sum $primary | sha256sum | awk '{print $1}')
          find target/release -type f ! -name '*.d' ! -name 'CACHEDIR.TAG' \
            ! -name '.cargo-lock' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          {
            echo "crate=$crate"
            echo "version=$version"
            echo "commit=$commit"
            echo "toolchain=$toolchain"
            echo "primary_hash=$primary_hash"
          } >> "$GITHUB_OUTPUT"

      - name: write provenance note
        # Same rule as above: `${{ }}` inside a `run:` body is shell code.
        env:
          CRATE: $CRATE
          REF: $REF
          VERSION: $OUT_VERSION
          OUT_CRATE: $OUT_CRATE
          OUT_VERSION: $OUT_VERSION
          OUT_COMMIT: $OUT_COMMIT
          OUT_TOOLCHAIN: $OUT_TOOLCHAIN
          OUT_HASH: $OUT_HASH
          OUT_RUNNER: $OUT_RUNNER
        run: |
          set -euo pipefail
          mkdir -p eng/provenance
          f="eng/provenance/${CRATE}-${VERSION}.json"
          {
            echo '{'
            echo "  \"crate\": \"$OUT_CRATE\","
            echo "  \"version\": \"$OUT_VERSION\","
            echo "  \"commit\": \"$OUT_COMMIT\","
            echo "  \"repo\": \"$CRATE\","
            echo "  \"ref\": \"$REF\","
            echo "  \"toolchain\": \"$OUT_TOOLCHAIN\","
            echo "  \"hash\": \"$OUT_HASH\","
            echo "  \"built\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"runner\": \"$OUT_RUNNER\","
            echo '  "flags": "--release --locked"'
            echo '}'
          } > "$f"
          cp kit/SHA256SUMS "eng/provenance/${CRATE}-${VERSION}.SHA256SUMS"
          cat "$f"

      - name: GitHub artifact attestation (best-effort)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: kit/target/release

      - name: commit provenance to engineering-standards
        working-directory: eng
        run: |
          set -euo pipefail
          git config user.name "provenance-bot"
          git config user.email "provenance-bot@users.noreply.github.com"
          git add provenance/
          git commit -m "chore(provenance): $CRATE $OUT_VERSION @ $OUT_COMMIT"
          git push
