# WyattAu shared Haskell CI — the Haskell gate matrix (proportionate to
# rust-kit.yml). Called from each Haskell repo:
#   jobs:
#     quality:
#       uses: WyattAu/engineering-standards/.github/workflows/haskell-kit.yml@main
#       with:
#         ghc-version: "9.8.4"
#
# Gates: cabal build (warnings-as-errors) → test → hlint → fourmolu check.
# weeder + docs live in repo CI (they need repo-specific hie/doc config).

name: quality

on:
  workflow_call:
    inputs:
      ghc-version:
        description: "GHC version"
        required: false
        default: "9.8.4"
        type: string
      lint:
        description: "Run hlint"
        required: false
        default: true
        type: boolean
      format:
        description: "Run fourmolu --mode check + cabal-fmt -c"
        required: false
        default: true
        type: boolean
      test:
        description: "Run cabal test all"
        required: false
        default: true
        type: boolean

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: ${{ inputs.ghc-version }}
          cabal-version: latest

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ inputs.ghc-version }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
          restore-keys: cabal-${{ inputs.ghc-version }}-

      # Hackage mirrors 403 intermittently (estate PITFALLS): retry before
      # failing, or the kit flaps for reasons that have nothing to do with
      # the code under test.
      - name: cabal update (mirrors 403 intermittently; retry before failing)
        run: |
          for attempt in 1 2 3; do
            if cabal update; then exit 0; fi
            echo "cabal update attempt ${attempt} failed; retrying in 15s" >&2
            sleep 15
          done
          echo "cabal update failed after 3 attempts" >&2
          exit 1
      - name: build (warnings are errors via cabal.project)
        run: cabal build all

      - name: test
        if: ${{ inputs.test }}
        run: cabal test all

      - name: hlint (pinned)
        if: ${{ inputs.lint }}
        # Pinned, not 'latest': a new hlint release can introduce findings and
        # break every consumer's gate with no code change of its own. Bump the
        # pin deliberately, with CI green across consumers.
        run: |
          rm -rf /tmp/hlint && mkdir -p /tmp/hlint
          curl -sSfL https://github.com/ndmitchell/hlint/releases/download/v3.10/hlint-3.10-x86_64-linux.tar.gz | tar xz -C /tmp/hlint
          HLINT="$(find /tmp/hlint -type f -name hlint | head -1)"
          "$HLINT" .

      - name: fourmolu + cabal-fmt check
        if: ${{ inputs.format }}
        run: |
          cabal install fourmolu cabal-fmt --overwrite-policy=always --installdir="$HOME/.local/bin"
          "$HOME/.local/bin/fourmolu" --mode check .
          find . -name '*.cabal' -not -path './dist-newstyle/*' -exec "$HOME/.local/bin/cabal-fmt" -c {} +
