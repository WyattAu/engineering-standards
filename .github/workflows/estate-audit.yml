name: estate-audit

# Keeps estate.yml honest. The manifest is only useful if it cannot drift from
# reality, so this runs on every edit to the manifest and nightly otherwise.

on:
  push:
    branches: [main]
    paths: ["estate.yml", "scripts/estate-audit.py", "scripts/check-repo-crate-alignment.py"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Audit the estate manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/estate-audit.py

      # Naming-convention rule 1 (one crate per repo, same name). Reported, not
      # gated: the 17 pending renames are a deliberate owner batch, and every
      # one of them is enumerated in the checker's GRANDFATHERED table with the
      # exact `gh repo rename` command. Failing here would only block unrelated
      # merges until someone runs the batch.
      - name: Audit repo<->crate name alignment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check-repo-crate-alignment.py --owner WyattAu             | tee repo-crate-alignment.txt
          echo "--- summary ---"
          grep -E "^( +[a-z-]+:|PENDING RENAMES)" repo-crate-alignment.txt || true

      - name: Fail on unclaimed crates or unpinned core repos
        # The audit exits 1 on manifest errors. Drift and coverage debt are
        # reported but do not fail the run: they are work items, not schema
        # violations, and blocking merges on them would stall the estate.
        run: |
          python scripts/estate-audit.py --json > audit.json || true
          python - <<'PY'
          import json, sys
          d = json.load(open("audit.json"))
          errs = [f for f in d["findings"] if f["kind"] == "error"]
          if errs:
              for f in errs:
                  print(f"::error::{f['subject']}: {f['message']}")
              sys.exit(1)
          print(f"manifest clean: {d['repos']} repos, {d['crates']} crates")
          PY
