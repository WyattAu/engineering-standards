name: estate-audit

# Keeps estate.yml honest. The manifest is only useful if it cannot drift from
# reality, so this runs on every edit to the manifest and nightly otherwise.

on:
  push:
    branches: [main]
    paths:
    - "estate.yml"
    - "scripts/estate-audit.py"
    - "scripts/check-repo-crate-alignment.py"
    - "scripts/check-llms-links.py"
    - "scripts/test-estate-audit-private-scope.py"
    - "scripts/test-estate-yml-schema.py"
    - "scripts/check-pin-consistency.py"
    - "scripts/check-standards-index.py"
    - "scripts/check-design-tokens.py"
    - "scripts/test-check-design-tokens.py"
    - "STANDARDS-INDEX.md"
    - "DESIGN.md"
    - "STANDARDS-MODEL.md"
    - "COMMITS.md"
    - "settings-policy.yml"
    - "tokens/**"
    - "scripts/check-commits.py"
    - "scripts/test-check-commits.py"
    - "scripts/audit-repo-settings.py"
    - "ADOPTION.md"
    - "candidates.yml"
    - "scripts/check-adoption.py"
    - "scripts/test-check-adoption.py"
    - "scripts/check-adr.py"
    - "scripts/test-check-adr.py"
    - "DECISIONS.md"
    - "docs/adr/**"
    - "scripts/check-hygiene.py"
    - "scripts/test-check-hygiene.py"
    - "REPO-HYGIENE.md"
    - "SECURITY.md"
    - ".github/CODEOWNERS"
    - ".github/PULL_REQUEST_TEMPLATE.md"
    - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Manifest schema
        run: python scripts/test-estate-yml-schema.py

      - name: Audit the estate manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/estate-audit.py

      # Naming-convention rule 1 (one crate per repo, same name). Reported, not
      # gated: the 17 pending renames are a deliberate owner batch, and every
      # one of them is enumerated in the checker's GRANDFATHERED table with the
      # exact `gh repo rename` command. Failing here would only block unrelated
      # merges until someone runs the batch.
      - name: Audit repo<->crate name alignment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check-repo-crate-alignment.py --owner WyattAu             | tee repo-crate-alignment.txt
          echo "--- summary ---"
          grep -E "^( +[a-z-]+:|PENDING RENAMES)" repo-crate-alignment.txt || true

      # The audit's severity for "manifest repo not returned" depends on token
      # scope: GITHUB_TOKEN cannot see private repos, a PAT can. Loop 25 shipped
      # a six-day red because CI asserted absence it was not entitled to see.
      - name: Self-test the private-scope severity rule
        run: python scripts/test-estate-audit-private-scope.py

      - name: Fail on unclaimed crates or unpinned core repos
        env:
          # The audit's severity rules read the token's reach; without a token
          # here it cannot prove visibility and every private repo looks gone.
          GH_TOKEN: ${{ github.token }}
        # The audit exits 1 on manifest errors. Drift and coverage debt are
        # reported but do not fail the run: they are work items, not schema
        # violations, and blocking merges on them would stall the estate.
        run: |
          python scripts/estate-audit.py --json > audit.json || true
          python - <<'PY'
          import json, sys
          d = json.load(open("audit.json"))
          errs = [f for f in d["findings"] if f["kind"] == "error"]
          if errs:
              for f in errs:
                  print(f"::error::{f['subject']}: {f['message']}")
              sys.exit(1)
          print(f"manifest clean: {d['repos']} repos, {d['crates']} crates")
          PY

  # Loop 25: all ten templates shipped llms.txt with literal `$1` placeholders
  # -- three broken URLs each, live for thirteen loops, because nothing looked
  # at the file. This job is the recurrence guard and it gates.
  llms-links:
    name: llms.txt links (no placeholders)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Self-test the checker
        run: python scripts/test-check-llms-links.py

      - name: Every repo's llms.txt must have real URLs
        run: python scripts/check-llms-links.py --estate estate.yml

  # Loop 26: seven actions were pinned to two different SHAs in different
  # repos -- every pin individually reproducible, so nothing looked wrong,
  # yet the estate had no single version of its own automation. 97 pins were
  # converged; this job keeps them converged.
  pin-consistency:
    name: one pin per action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Every action must have exactly one SHA estate-wide
        run: python scripts/check-pin-consistency.py --estate estate.yml

  # Round 43: a standard that cannot be counted is an opinion. These run the
  # gates' own self-tests, so a broken gate fails here instead of in the first
  # repository that adopts it. Advisory for exactly one loop (LOOP.md), then
  # blocking: nothing here needs a credential or a network call, which is the
  # only reason it is allowed to graduate at all.
  standards-index:
    name: standards index + design tokens
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Self-test the design-token gate
        run: python scripts/test-check-design-tokens.py

      # --require-scales is what makes the type, spacing and motion groups
      # mandatory: without it a document that dropped a whole scale would
      # still pass, because the rules only validate groups that exist.
      - name: Design tokens pass the gate (dark)
        run: python scripts/check-design-tokens.py tokens/estate-dark.dtcg.json --require-scales

      - name: Design tokens pass the gate (light)
        run: python scripts/check-design-tokens.py tokens/estate-light.dtcg.json --require-scales

      - name: Self-test the commit gate
        run: python scripts/test-check-commits.py

      # Advisory on purpose: history predates the contract (the measured
      # baseline is in COMMITS.md), so only new commits are expected to
      # satisfy it. Removing the guard before the history rolls over would
      # make the job permanently red and train people to ignore it.
      - name: Commit contract on recent history (advisory)
        continue-on-error: true
        run: python scripts/check-commits.py --range HEAD~5..HEAD

      - name: Repository settings, sampled (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit-repo-settings.py --limit 10

      # A candidate registry is only worth keeping if it cannot quietly rot
      # into guesses: the gate rejects unverified licences, expired review
      # dates and decisions outside the closed vocabulary (AD-1..AD-9).
      - name: Self-test the adoption gate
        run: python scripts/test-check-adoption.py

      - name: Candidate registry conforms to ADOPTION.md
        run: python scripts/check-adoption.py

      # ADR records are a format contract (DC-1..DC-8): filename, status,
      # ISO date, required sections. Gated (ADR-0018 graduated 2026-11-09).
      - name: Self-test the ADR gate
        run: python scripts/test-check-adr.py

      - name: ADR records conform to DECISIONS.md
        run: python scripts/check-adr.py

      - name: Self-test the repo hygiene gate
        run: python scripts/test-check-hygiene.py

      - name: Repo hygiene files conform to REPO-HYGIENE.md
        run: |
          # Advisory for one loop (ADR-0019, AGENTS.md rule 3); the
          # standards index records this as advisory. The step fails on
          # real findings so the log is explicit; the job is
          # continue-on-error while advisory.
          python scripts/check-hygiene.py --path .

      - name: Every concern's standard and gate must exist
        run: python scripts/check-standards-index.py

      - name: Build-info record must be deterministic
        run: |
          bash scripts/buildinfo.sh --out /tmp/build-a.json
          bash scripts/buildinfo.sh --out /tmp/build-b.json
          bash scripts/buildinfo.sh --compare /tmp/build-a.json /tmp/build-b.json
