# WyattAu shared C++ CI — the gate matrix (proportionate to rust-kit.yml).
# Called from each C++ repo:
#   jobs:
#     gates:
#       uses: WyattAu/engineering-standards/.github/workflows/cpp-kit.yml@main
#       with:
#         tier: full
#
# Tier semantics (preset groups; every leg configures via an existing
# CMake preset and runs ctest there):
#   fast — format + docs + presets + headless legs + contract
#   full — fast + tsan + asan-ubsan + vulkan-validation + live proofs
#
# Repo-specific bodies stay in the caller via inputs (warploom's values are
# the defaults, so warploom passes only `tier`). Developed and executed
# first in WyattAu/warploom; second caller: WyattAu/warploom-game.
name: C++ gates

on:
  workflow_call:
    inputs:
      tier:
        description: "Gate tier: fast | full"
        required: false
        default: "full"
        type: string
      format_paths:
        description: "Space-separated source dirs for the clang-format check"
        required: false
        default: "modules examples tests tools"
        type: string
      enable_vulkan_validation:
        description: "Run the Vulkan validation leg (needs Vulkan sources)"
        required: false
        default: true
        type: boolean
      enable_live_proof:
        description: "Run the live-proof leg (needs live_proof_command)"
        required: false
        default: true
        type: boolean
      live_proof_command:
        description: "Repo-specific live-proof body: start hosts, run harness"
        required: false
        default: |
          build/headless-debug/bin/warploom_headless_host /tmp/proof_a.sock 2>/tmp/proof_a.log &
          build/headless-debug/bin/warploom_headless_host /tmp/proof_b.sock 2>/tmp/proof_b.log &
          for i in $(seq 1 50); do
            [ -S /tmp/proof_a.sock ] && [ -S /tmp/proof_b.sock ] && break
            sleep 0.2
          done
          test -S /tmp/proof_a.sock && test -S /tmp/proof_b.sock
          python3 tools/live_proof.py all --sock /tmp/proof_a.sock --sock-a /tmp/proof_a.sock --sock-b /tmp/proof_b.sock
        type: string
      enable_docs:
        description: "Run the docs leg (needs docs_command)"
        required: false
        default: true
        type: boolean
      docs_command:
        description: "Repo-specific docs check"
        required: false
        default: "python3 scripts/check_docs_links.py"
        type: string
      enable_examples:
        description: "Run the examples leg (builds the default preset)"
        required: false
        default: true
        type: boolean
      examples_assert_command:
        description: "Repo-specific assertion on the default-preset build"
        required: false
        default: |
          test -x build/default/bin/warploom_viewport
          n=$(ls build/default/shaders/*.spv | wc -l)
          echo "compiled shaders: $n"
          test "$n" -ge 70
        type: string
      examples_artifact_name:
        description: "Upload artifact name for the examples-leg binary"
        required: false
        default: "warploom-viewport"
        type: string
      examples_artifact_path:
        description: "Binary uploaded by the examples leg"
        required: false
        default: "build/default/bin/warploom_viewport"
        type: string

jobs:
  # The interface check travels with the gates. The estate repo is checked
  # out alongside the caller, so the check sees both sides: the caller's
  # `uses:` + inputs and this file's gate list. No helper file needed in
  # the caller.
  contract:
    name: "CI contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: WyattAu/engineering-standards
          path: estate
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check caller/callee contract
        run: python3 estate/scripts/check_cpp_contract.py

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find ${{ inputs.format_paths }} \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0 clang-format --dry-run --Werror

  # ============================================================================
  # Headless Debug — canonical runtime + rendering tests
  # ============================================================================
  headless-debug:
    name: "Headless Debug"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CPM's source cache is shared across binary directories, so this also
      # makes switching preset free locally. Keyed on the manifests that can
      # change what gets fetched.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3

      - name: Configure
        run: cmake --preset headless-debug

      - name: Build
        run: cmake --build build/headless-debug -j$(nproc)

      - name: Test
        run: ctest --test-dir build/headless-debug --output-on-failure --timeout 120

      - name: Benchmark
        run: |
          build/headless-debug/bin/warploom_deterministic_runtime_benchmark --output benchmark.json
          cat benchmark.json

  # ============================================================================
  # Headless Debug (Clang) — fallback-compiler matrix leg: exercises every
  # non-GCC-gated C++26 path (no reflection/contracts on Clang yet)
  # ============================================================================
  headless-debug-clang:
    name: "Headless Debug (Clang)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CPM's source cache is shared across binary directories, so this also
      # makes switching preset free locally. Keyed on the manifests that can
      # change what gets fetched.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang python3

      - name: Configure
        run: cmake --preset headless-debug-clang

      - name: Build
        run: cmake --build build/headless-debug-clang -j$(nproc)

      - name: Test
        run: ctest --test-dir build/headless-debug-clang --output-on-failure --timeout 120

  # ============================================================================
  # Headless Release — optimized build validation
  # ============================================================================
  headless-release:
    name: "Headless Release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CPM's source cache is shared across binary directories, so this also
      # makes switching preset free locally. Keyed on the manifests that can
      # change what gets fetched.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3

      - name: Configure
        run: cmake --preset headless-release

      - name: Build
        run: cmake --build build/headless-release -j$(nproc)

      - name: Test
        run: ctest --test-dir build/headless-release --output-on-failure --timeout 120

  # ============================================================================
  # ThreadSanitizer
  # ============================================================================
  tsan:
    if: ${{ inputs.tier == 'full' }}
    name: "ThreadSanitizer"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CPM's source cache is shared across binary directories, so this also
      # makes switching preset free locally. Keyed on the manifests that can
      # change what gets fetched.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3

      - name: Configure
        run: cmake --preset tsan

      - name: Build
        run: cmake --build build/tsan -j$(nproc)

      - name: Test
        env:
          TSAN_OPTIONS: "halt_on_error=1 history_size=7"
        run: ctest --test-dir build/tsan --output-on-failure --timeout 120

  # ============================================================================
  # AddressSanitizer + UndefinedBehaviorSanitizer
  # ============================================================================
  asan-ubsan:
    if: ${{ inputs.tier == 'full' }}
    name: "ASan + UBSan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CPM's source cache is shared across binary directories, so this also
      # makes switching preset free locally. Keyed on the manifests that can
      # change what gets fetched.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3

      - name: Configure
        run: cmake --preset asan-ubsan

      - name: Build
        run: cmake --build build/asan-ubsan -j$(nproc)

      - name: Test
        run: ctest --test-dir build/asan-ubsan --output-on-failure --timeout 120

  # ============================================================================
  # Vulkan validation — Khronos layer on Mesa lavapipe (software GPU)
  # ============================================================================
  vulkan-validation:
    if: ${{ inputs.tier == 'full' && inputs.enable_vulkan_validation }}
    name: "Vulkan Validation (lavapipe)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CPM's source cache is shared across binary directories, so this also
      # makes switching preset free locally. Keyed on the manifests that can
      # change what gets fetched.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install toolchain + Vulkan stack
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 \
            libvulkan-dev glslang-tools vulkan-validationlayers vulkan-tools \
            mesa-vulkan-drivers libx11-dev libxcb1-dev

      - name: Vulkan driver smoke test
        run: vulkaninfo --summary

      - name: Configure
        run: cmake --preset vulkan-validation

      - name: Build
        run: cmake --build build/vulkan-validation -j$(nproc)

      - name: Test
        run: ctest --test-dir build/vulkan-validation --output-on-failure --timeout 300

  # ============================================================================
  # Live protocol proofs (P0) — the checked-in harness (tools/live_proof.py)
  # against headless control hosts (EditorSession + ControlServer, no GPU):
  # W1 scrubber, G1 save/load round-trip, the W2 record→load→
  # byte-identical two-instance proof, and the G3 timeline clip proof,
  # all over a real socket.
  # ============================================================================
  live-proof:
    if: ${{ inputs.tier == 'full' && inputs.enable_live_proof }}
    name: "Live Protocol Proofs (headless)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CPM's source cache is shared across binary directories, so this also
      # makes switching preset free locally. Keyed on the manifests that can
      # change what gets fetched.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3

      - name: Configure
        run: cmake --preset headless-debug

      - name: Build
        run: |
          cmake --build build/headless-debug -j$(nproc)

      - name: Run repo live proofs
        run: ${{ inputs.live_proof_command }}

  # ============================================================================
  # Documentation links
  # ============================================================================
  docs:
    if: ${{ inputs.enable_docs }}
    name: "Documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CPM's source cache is shared across binary directories, so this also
      # makes switching preset free locally. Keyed on the manifests that can
      # change what gets fetched.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Check docs
        run: ${{ inputs.docs_command }}

  # ============================================================================
  # Examples — builds the viewport, the one user-facing artifact.
  #
  # Every other job sets WARPLOOM_BUILD_EXAMPLES=OFF, so a 5,500-line
  # translation unit that is the engine's only real application had never been
  # compiled by CI. It also proves the shader pipeline (cmake/Shaders.cmake)
  # runs from a clean checkout: the .spv output directory is the build root,
  # not somewhere under tests/.
  #
  # It builds here; it cannot present, because lavapipe has no window. The
  # viewport binary is uploaded so the build is verifiable by artifact.
  # ============================================================================
  examples:
    if: ${{ inputs.tier == 'full' && inputs.enable_examples }}
    name: "Viewport builds"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install toolchain + Vulkan stack + shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang python3 \
            libvulkan-dev glslang-tools mesa-vulkan-drivers \
            libx11-dev libxcb1-dev pkg-config

      - name: Configure
        run: cmake --preset default

      - name: Build (compiles all 73 shaders into the build root)
        run: cmake --build build/default -j$(nproc)

      - name: Assert on the default-preset build
        run: ${{ inputs.examples_assert_command }}

      - name: Upload the built binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.examples_artifact_name }}
          path: ${{ inputs.examples_artifact_path }}
          retention-days: 7

  # ============================================================================
  # Presets — the documented entry points must actually configure.
  #
  # cmake --preset default used to abort on a hardcoded /nix/store Qt6_DIR,
  # which is the command a new contributor runs first. Cheap to check, so it
  # is checked on every push.
  # ============================================================================
  presets:
    name: "Presets are usable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang python3

      - name: Every visible preset lists
        run: |
          cmake --list-presets
          cmake --build --list-presets
          ctest --list-presets

      - name: default configures and builds
        run: |
          cmake --preset default
          cmake --build build/default -j$(nproc)
          ctest --test-dir build/default --output-on-failure --timeout 300
