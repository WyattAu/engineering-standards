  statement-ofx:
    area: money
    status: core
    notes: "OFX 1.x bank-statement adapter producing recon-kit Statements. Signs become direction at the boundary; amounts go from decimal string to integer minor units without a float on the path (0.07 through a float is 6.999999999999999, and which way that rounds decides whether a line matches). OFX publishes the closing balance but not the opening, so the adapter derives it and records that the balance identity is trivial for this format. Scale is explicit because OFX does not declare it. Published 2026-10-07."
    crates:
      - statement-ofx
    _seen:
      last_push: "2026-10-07"
      statement-ofx: 0.1.0

  report-kit:
    area: money
    status: core
    notes: "Trial balance and aging over a double-entry ledger. Per currency by construction \u2014 summing a GBP bank account with a JPY fee account is a number in no currency \u2014 with the accounting equation (assets + expenses = liabilities + equity + revenue) as a per-currency runtime check. Aging runs from the due date, not the issue date; abnormal balances are a predicate, not a normalization. Published 2026-10-07 with a reporting suite over the month-close ledger."
    crates:
      - report-kit
    _seen:
      last_push: "2026-10-07"
      report-kit: 0.1.0

  recon-kit:
    area: money
    status: core
    notes: "Bank statement types and a matching engine for reconciling statements against a ledger. No format parsing (OFX/CAMT adapters are separate), no tolerance (exact integer comparison only), no silent auto-matching (ambiguity is surfaced, never resolved). Direction is a value, not a sign \u2014 OFX's signed amounts normalise at the boundary. The balance identity is the import check that catches a truncated import. Published 2026-10-07 with a double-entry month-close suite."
    crates:
      - recon-kit
    _seen:
      last_push: "2026-10-07"
      recon-kit: 0.1.0

  report-kit:
    area: money
    status: core
    notes: "Trial balance and aging reports over double-entry (the estate's ledger crate). Per-currency by construction: the balance identity is checked per currency, and a ledger balanced in GBP and unbalanced in JPY is reported as exactly that. The accounting equation is a runtime check with the period's result still sitting in revenue and expense -- no closing entries are required for a truthful report. Aging buckets escalate on the promised date, never the issue date, per the item's own currency. The cut-off is a YYYY-MM-DD string comparison. Registered 2026-10-23 the day it appeared; composed the same day in estate-integration's reporting suite."
    crates:
      - report-kit
    _seen:
      last_push: "2026-10-23"
      report-kit: 0.1.0

  vat-rules:
    area: money
    status: core
    notes: "The tax vocabulary both sides of a ledger share: UNCL5305 categories with their CEF VATEX-* reasons, UNTDID 1001 document types, ZATCA's five issue reasons, the four rounding regimes, and TieMode. Zero dependencies by design \u2014 TieMode is policy vocabulary, not arithmetic machinery, so a table of tax codes does not depend on a double-entry engine to say round-ties-away-from-zero. Extracted 2026-10-06 so AP imports the same table AR does."
