# Estate manifest — the registry of record for the WyattAu estate.
#
# One entry per repo: its area, its status, and the crates.io packages it
# publishes. `scripts/estate-audit.py` verifies this file against GitHub,
# crates.io, and the exact pins held by consumer suites, and fails when the
# three disagree. Run it after any publish, repo rename, or pin change.
#
# ## status
#
# | status | meaning |
# |---|---|
# | `core` | published and dogfooded — a consumer suite pins it exactly |
# | `support` | published and active, not yet composed by a suite |
# | `orphan` | published but neither composed nor recently active |
#
# The six ui/docs crates added 2026-10-18 (`color-kit`, `theme-kit`,
# `theme-egui`, `a11y-kit`, `tui-actions`, `docs-core`) are `support`,
# deliberately **not** `core`: `core` means a consumer suite pins them
# exactly, and none is wired yet — `estate-audit` enforces that claim, so
# calling them `core` early would be a gate lying. They graduate when
# dogfooded (`theme-egui` → `chisel-doc` is the first). `font-conformance`
# is `personal`: it publishes no crate (a differential harness, not a
# library). |
# | `dormant` | no meaningful activity; superseded or shelved |
# | `template` | scaffolding whose purpose is to seed other repos |
# | `fork` | upstream fork kept for vendoring or patching |
# | `personal` | private; not part of the published estate |
# | `infra` | CI, images, taps, stacks — no published crate |

# ## area
#
# `infra` `auth` `net` `obsv` `money` `data` `conc` `ui` `dx` `docs`
# `app` `research` `personal`
#
# `_seen` blocks are generated — refresh with `estate-audit.py --sync`.

# ## pins_held
#
# Exact pins a consumer deliberately holds behind the published version, with
# the reason. Keeping them here rather than in a comment inside the
# consumer's Cargo.toml means the audit can tell "held on purpose, here is
# why" apart from "nobody noticed", and CI will fail if a hold loses its
# reason or names an unknown consumer.
#
# Currently empty: the last hold (outbox-kit, waiting on a ledger-kit
# consumer) was released when ledger-kit 0.1.1 shipped.
pins_held: []

