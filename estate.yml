  input-kit:
    area: ui
    status: core
    notes: "Toolkit-neutral text-composition semantics (L1): IME preedit state machine, grapheme-cluster caret mapping for all four platform cursor units (Win32/macOS/web UTF-16, Wayland/X11 bytes), dead-key composition. no_std + alloc, zero estate deps. The gap was measured, not assumed: no crate in the ledger provided composition semantics. Published 2026-10-18 with a consumer already in place per ADR-0005; the composing suite recorded the a11y-kit `busy`-state gap."
    crates:
      - input-kit
    _seen:
      last_push: "2026-10-18"
      input-kit: 0.1.0

  ui-text-edit:
    area: ui
    status: core
    notes: "Text-field semantics (L2): a buffer-agnostic TextBuffer trait (insurance against ropey 2.0 flipping char indexing to byte), a grapheme-correct caret/selection/edit model, an IME bridge over input-kit, and an a11y bridge over a11y-kit behind the `a11y` feature. Deliberately NOT an editing engine: the estate's four UI surfaces include no code editor, so a Helix-class engine would have zero consumers. ADR-0006 records the survey of five existing crates and why none was adopted. Published 2026-10-18; its composing suite found a real bug in the crate (unbounded accessible announcement) before publication."
    crates:
      - ui-text-edit
    _seen:
