    license_verified: true
    stars: 51120
    pushed: "2026-11-09"
    open_issues: 2293
    language: Rust
    source: https://api.github.com/repos/astral-sh/ruff
    rationale: >-
      A Rust linter and formatter would replace the Python-side tooling in
      OmniPython, but the current checks are already gated; adopting it is a
      speed decision, not a correctness one, and needs a measurement first.
    review_by: "2027-02-07"

  - name: zed-industries/zed
    url: https://github.com/zed-industries/zed
    decision: hold
    license: null
    license_verified: false
    stars: 94516
    pushed: "2026-11-09"
    open_issues: 3076
    language: Rust
    source: https://api.github.com/repos/zed-industries/zed
    rationale: >-
      The editor is the strongest available reference for a Rust text stack and
      GPU rendering, and it is exactly the kind of code worth reimplementing
      rather than copying, if the licence turns out to be GPL.
    open_question: >-
      What do the LICENSE-* files say? The API reports NOASSERTION while the
      project is widely described as GPL-3.0; that distinction decides whether
      this is study material (AD-3) or nothing at all.
    review_by: "2027-02-07"

