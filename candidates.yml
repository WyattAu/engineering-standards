# Candidate registry for ADOPTION.md (AD-1..AD-9).
#
# Every value below was read from the GitHub REST API on `measured`; nothing
# here is remembered. Unknown values are null, never a guess (AD-8).
# `source` is the exact endpoint the numbers came from, so a reader can re-run
# one curl and check the row instead of trusting the file.
#
# Decisions: adopt | fork | rebuild | follow | hold | reject.
# Review dates are at most 180 days after `measured` (AD-9).

measured: "2026-11-09"
method: >-
  Candidate set assembled from GitHub trending and self-hosted/fun-project
  lists in early November 2026, then narrowed to projects that would touch an
  estate concern (toolchain, crawling, accessibility, design, agents, metrics,
  hosting). Star counts, licences, push dates and open issues come from
  `GET /repos/{owner}/{repo}`; language is the API's `language` field.

candidates:
  - name: nushell/nushell
    url: https://github.com/nushell/nushell
    decision: follow
    license: MIT
    license_verified: true
    stars: 41067
    pushed: "2026-11-08"
    open_issues: 1459
    language: Rust
    source: https://api.github.com/repos/nushell/nushell
    rationale: >-
      A structured shell is a better ergonomic model than POSIX text streams
      for estate scripts, but no crate or gate consumes it today, so reading
      the pipeline design is the whole commitment.
    review_by: "2027-02-07"

  - name: slint-ui/slint
    url: https://github.com/slint-ui/slint
    decision: hold
    license: null
    license_verified: false
    stars: 24481
    pushed: "2026-11-09"
    open_issues: 751
    language: Rust
    source: https://api.github.com/repos/slint-ui/slint
    rationale: >-
      The most credible Rust UI toolkit candidate for a future L2, but the API
      reports NOASSERTION, so the licence is unknown rather than permissive.
    open_question: >-
      Which terms actually apply: the dual GPL-3.0-or-commercial licence the
      project documents, or something else in the tree? Read LICENSE files
      before any design work, because a GPL-3.0 outcome forbids adoption.
    review_by: "2027-02-07"

  - name: astral-sh/ruff
    url: https://github.com/astral-sh/ruff
    decision: follow
