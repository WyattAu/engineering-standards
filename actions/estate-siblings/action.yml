# Checks out the estate siblings a caller's path dependencies name, beside
# the caller's checkout — bootstrap.sh's layout, for a runner. Public estate
# repos need no auth; pass `token` for private ones.
#
# Input: `siblings` — space-separated repo names (WyattAu/<name> implied).
#
# Inputs arrive through env: a ${{ }} expansion inside `run:` splices a
# caller-controlled string into shell source. That is a template-injection
# finding (zizmor) and it is real here — the workflow calling this action
# decides what lands between the quotes.
name: "Check out estate siblings"
description: "Clones each named estate repo one directory above the caller, so ../<name> path dependencies resolve."
inputs:
  siblings:
    description: "Space-separated estate repo names (e.g. 'mp4-core id3-core')"
    required: true
  token:
    description: "PAT with read access to the estate (only needed while siblings are private)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        SIBLINGS: ${{ inputs.siblings }}
        SIBLING_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        read -ra names <<< "$SIBLINGS"
        for sibling in "${names[@]}"; do
          [ -n "$sibling" ] || continue
          dest="$GITHUB_WORKSPACE/../$sibling"
          if [ -d "$dest" ]; then
            echo "sibling $sibling already present"
            continue
          fi
          if [ -n "$SIBLING_TOKEN" ]; then
            # Authorization goes in a header, not the URL: a failed clone
            # echoes the URL, and remotes keep it in .git/config.
            auth=$(printf 'x-access-token:%s' "$SIBLING_TOKEN" | base64 -w0)
            git -c "http.extraheader=Authorization: Basic $auth" \
              clone --depth 1 "https://github.com/WyattAu/$sibling" "$dest"
          else
            git clone --depth 1 "https://github.com/WyattAu/$sibling" "$dest"
          fi
        done
