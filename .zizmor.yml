# zizmor configuration (loop 30).
#
# `impostor-commit` is disabled for a measured reason, not for convenience.
# dtolnay/rust-toolchain publishes no immutable release SHAs: `stable`,
# `nightly`, and `master` are moving branches, so the online audit reports
# every pinned branch-head commit as "commit with no history in referenced
# repository". Loop 30 verified through the GitHub API that every SHA the
# estate pins resolves as a real commit upstream ("toolchain: stable",
# "toolchain: nightly", and a merge commit), and CI resolves the same pins
# on every run. The pins stay: they keep the toolchain reproducible and the
# MSRV gate un-bumpable.
#
# Note: zizmor does not honour `# zizmor: ignore[...]` comments for this
# audit (three attempts, including correct adjacency), which is why the
# decision lives here -- one place, with the evidence beside it.
#
# Everything else stays enabled. CI gates on `min-severity: high`
# (template-injection, cache-poisoning); Medium/Low keep printing.
rules:
  impostor-commit:
    disable: true
